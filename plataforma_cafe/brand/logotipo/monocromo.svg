<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Red Café Ecuador">
  <!--
    Un solo color mediante currentColor: sirve en café sobre papel y al revés,
    sin duplicar archivo. La hendidura se recorta del grano para leerse en negativo.
  -->
  <g color="#FBFAF7">
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Arco superior: entra por la izquierda y apunta a la derecha -->
      <path d="M18 32a35 35 0 0 1 54-6"/>
      <path d="M60 21l12 5-4 12"/>
      <!-- Arco inferior: cierra el giro en sentido contrario -->
      <path d="M78 64a35 35 0 0 1-54 6"/>
      <path d="M36 75l-12-5 4-12"/>
    </g>

    <mask id="hendidura-m">
      <rect width="96" height="96" fill="#fff"/>
      <path d="M48 34c-3.6 5.6 3.6 11.2 0 16.8s-3.6 11.2 0 16.8" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    </mask>
    <ellipse cx="48" cy="50" rx="12" ry="17" fill="currentColor" mask="url(#hendidura-m)"/>
  </g>
</svg>
