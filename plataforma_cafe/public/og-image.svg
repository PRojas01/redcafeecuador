<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2314"/>
      <stop offset="100%" style="stop-color:#5C3A21"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D9B48F"/>
      <stop offset="100%" style="stop-color:#A07855"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grain texture -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.15"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.3"/>
  <!-- Decorative circles -->
  <circle cx="950" cy="120" r="180" fill="#D9B48F" opacity="0.08"/>
  <circle cx="1050" cy="480" r="120" fill="#A07855" opacity="0.06"/>
  <!-- Title -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#F4E6D4">Red Café</text>
  <text x="80" y="310" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#D9B48F">Ecuador</text>
  <!-- Subtitle -->
  <text x="80" y="380" font-family="Georgia, serif" font-size="28" fill="#F4E6D4" opacity="0.8">Compra y vende café ecuatoriano directo,</text>
  <text x="80" y="420" font-family="Georgia, serif" font-size="28" fill="#F4E6D4" opacity="0.8">de 1 libra a una cosecha.</text>
  <!-- Accent line -->
  <rect x="80" y="460" width="120" height="4" rx="2" fill="url(#accent)"/>
  <!-- URL -->
  <text x="80" y="520" font-family="Georgia, serif" font-size="20" fill="#D9B48F" opacity="0.7">solucionespro.net/redcafeecuador</text>
  <!-- Coffee bean icon (simplified) -->
  <ellipse cx="1000" cy="300" rx="60" ry="80" fill="#A07855" opacity="0.3" transform="rotate(-20 1000 300)"/>
  <line x1="970" y1="250" x2="1030" y2="350" stroke="#3D2314" stroke-width="3" opacity="0.4"/>
</svg>
