name: datos-personales
on:
  push:
  pull_request:
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar datos personales en el repositorio
        run: node herramientas/vigilar-datos.mjs
